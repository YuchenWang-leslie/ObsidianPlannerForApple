name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift core
        run: ./scripts/test-core.sh
      - name: Build native app
        run: swift build -c release
      - name: Compile separate macOS helper
        run: ./scripts/build-plugin-helper.sh
      - name: Test helper protocol and agent startup
        run: ./scripts/test-helper.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
